[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpkg"
version = "1.0.0"
description = "ForensicBench: reference agent and evaluation harness for scheme-level journal-entry fraud detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
dependencies = [
  "openai>=1.0",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "transformers>=4.40",
  "psycopg2-binary>=2.9",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["researchpkg*"]

[project.scripts]
forensicbench-run = "researchpkg.forensic_llm.run:main"
