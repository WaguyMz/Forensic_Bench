services:
  forensicbench-postgres:
    image: postgres:16-alpine
    container_name: forensicbench-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: forensicbench
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - forensicbench_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  forensicbench_pgdata:
