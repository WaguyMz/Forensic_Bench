<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 700" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- Icons: Lucide (ISC license), inlined as explicitly-coloured groups for renderer portability -->
  <defs>
    <style>
      .h1  { font-size:30px; font-weight:700; fill:#0f172a; }
      .h2  { font-size:17px; font-weight:400; fill:#64748b; }
      .stg { font-size:20px; font-weight:700; }
      .ttl { font-size:18px; font-weight:700; fill:#0f172a; }
      .sub { font-size:14px; font-weight:400; fill:#64748b; }
      .chip{ font-size:14px; font-weight:600; fill:#334155; }
      .sec { font-size:13px; font-weight:600; fill:#475569; }
      .foot{ font-size:15px; font-weight:400; font-style:italic; fill:#94a3b8; }
      .cap { font-size:16px; font-weight:700; fill:#0f172a; }
      .tbl { font-size:9px; font-weight:600; fill:#1e3a8a; font-family:'SFMono-Regular',Menlo,Consolas,monospace; }
      .tblr{ font-size:9px; font-weight:600; fill:#b91c1c; font-family:'SFMono-Regular',Menlo,Consolas,monospace; }
      .elbl{ font-size:8px; font-weight:600; fill:#94a3b8; font-style:italic; }
      .elblr{ font-size:8px; font-weight:600; fill:#dc2626; font-style:italic; }
      .ic  { fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .edge{ fill:none; stroke:#94a3b8; stroke-width:1.5; }
      .edger{ fill:none; stroke:#dc2626; stroke-width:1.5; stroke-dasharray:4 3; }
    </style>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1380" height="700" fill="#ffffff"/>

  <!-- ============================= TITLE ============================= -->
  <text x="690" y="48" text-anchor="middle" class="h1">ForensicBench</text>
  <text x="690" y="78" text-anchor="middle" class="h2">Can an LLM agent uncover fraud hidden inside a company&#8217;s accounting ledger?</text>

  <!-- ============================= STAGE ARROWS ============================= -->
  <polygon points="484,330 526,330 526,318 550,340 526,362 526,350 484,350" fill="#cbd5e1"/>
  <polygon points="914,330 956,330 956,318 980,340 956,362 956,350 914,350" fill="#cbd5e1"/>

  <!-- ============================================================== -->
  <!-- PANEL 1 : THE DATA  (x=20, width=460 — left margin reduced)    -->
  <!-- ============================================================== -->
  <rect x="20" y="110" width="460" height="530" rx="18" fill="#f8fafc" stroke="#dbe3ec" filter="url(#soft)"/>
  <rect x="20" y="110" width="460" height="6" rx="3" fill="#2563eb"/>
  <circle cx="54" cy="154" r="16" fill="#2563eb"/>
  <text x="54" y="160" text-anchor="middle" class="stg" fill="#ffffff">1</text>
  <text x="80" y="160" class="stg" fill="#2563eb">The data</text>

  <!-- sector badges -->
  <circle cx="114" cy="220" r="26" fill="#eff6ff" stroke="#bfdbfe"/>
  <g class="ic" stroke="#2563eb" transform="translate(98,204) scale(1.35)"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g>
  <text x="114" y="262" text-anchor="middle" class="sec">Energy</text>

  <circle cx="177" cy="220" r="26" fill="#eff6ff" stroke="#bfdbfe"/>
  <g class="ic" stroke="#2563eb" transform="translate(161,204) scale(1.35)"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></g>
  <text x="177" y="262" text-anchor="middle" class="sec">Health</text>

  <circle cx="240" cy="220" r="26" fill="#eff6ff" stroke="#bfdbfe"/>
  <g class="ic" stroke="#2563eb" transform="translate(224,204) scale(1.35)"><path d="M10.5 3 8 9l4 13 4-13-2.5-6"/><path d="M17 3a2 2 0 0 1 1.6.8l3 4a2 2 0 0 1 .013 2.382l-7.99 10.986a2 2 0 0 1-3.247 0l-7.99-10.986A2 2 0 0 1 2.4 7.8l2.998-3.997A2 2 0 0 1 7 3z"/><path d="M2 9h20"/></g>
  <text x="240" y="262" text-anchor="middle" class="sec">Luxury</text>

  <circle cx="303" cy="220" r="26" fill="#eff6ff" stroke="#bfdbfe"/>
  <g class="ic" stroke="#2563eb" transform="translate(287,204) scale(1.35)"><path d="M12 16h.01"/><path d="M16 16h.01"/><path d="M3 19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5a.5.5 0 0 0-.769-.422l-4.462 2.844A.5.5 0 0 1 15 10.5v-2a.5.5 0 0 0-.769-.422L9.77 10.922A.5.5 0 0 1 9 10.5V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M8 16h.01"/></g>
  <text x="303" y="262" text-anchor="middle" class="sec">Mfg.</text>

  <circle cx="366" cy="220" r="26" fill="#eff6ff" stroke="#bfdbfe"/>
  <g class="ic" stroke="#2563eb" transform="translate(350,204) scale(1.35)"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></g>
  <text x="366" y="262" text-anchor="middle" class="sec">Transport</text>

  <!-- ledger card -->
  <rect x="46" y="298" width="408" height="148" rx="12" fill="#ffffff" stroke="#dbe3ec"/>
  <g class="ic" stroke="#1d4ed8" transform="translate(66,328) scale(2.0)"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g>
  <text x="132" y="338" class="ttl">Realistic accounting ledger</text>
  <text x="132" y="362" class="sub">~300k journal entries &#183; 3 years</text>
  <text x="132" y="384" class="sub">vendors &#183; payroll &#183; sales &#183; inventory</text>
  <text x="132" y="414" class="sub">one ledger per sector &#183; just like</text>
  <text x="132" y="432" class="sub">a real company&#8217;s books</text>

  <!-- fraud + GL schema -->
  <rect x="46" y="458" width="408" height="158" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <g class="ic" stroke="#dc2626" transform="translate(60,472) scale(1.1)"><path d="M18 11c-1.5 0-2.5.5-3 2"/><path d="M4 6a2 2 0 0 0-2 2v4a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V8a2 2 0 0 0-2-2h-3a8 8 0 0 0-5 2 8 8 0 0 0-5-2z"/><path d="M6 11c1.5 0 2.5.5 3 2"/></g>
  <text x="88" y="484" class="chip" fill="#b91c1c">Real fraud hidden inside</text>
  <text x="88" y="500" class="sub" fill="#ef4444">a few hundred entries, unlabelled</text>

  <!-- mini GL schema (inside pink card) -->
  <rect x="54" y="508" width="392" height="96" rx="8" fill="#ffffff" stroke="#fecaca"/>

  <path class="edge" d="M122 556 H148"/>
  <text x="135" y="551" text-anchor="middle" class="elbl">1:N</text>
  <path class="edge" d="M178 548 V536"/>
  <text x="184" y="532" class="elbl">GL</text>
  <path class="edge" d="M212 556 H250"/>
  <path class="edger" d="M178 564 V576"/>
  <text x="184" y="573" class="elblr">eval</text>

  <rect x="58" y="548" width="64" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="90" y="561" text-anchor="middle" class="tbl">je_header</text>
  <rect x="148" y="548" width="64" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="180" y="561" text-anchor="middle" class="tbl">je_line</text>
  <rect x="148" y="528" width="64" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="180" y="540" text-anchor="middle" class="tbl">chart_of_accounts</text>
  <rect x="148" y="576" width="64" height="16" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="180" y="588" text-anchor="middle" class="tblr">anomaly_labels</text>

  <rect x="250" y="520" width="70" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="285" y="532" text-anchor="middle" class="tbl">vendors</text>
  <rect x="338" y="520" width="80" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="378" y="532" text-anchor="middle" class="tbl">customers</text>
  <rect x="250" y="548" width="70" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="285" y="560" text-anchor="middle" class="tbl">employees</text>
  <rect x="338" y="548" width="80" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="378" y="560" text-anchor="middle" class="tbl">hr_employees</text>

  <rect x="250" y="576" width="13" height="10" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="266" y="585" class="elbl" style="font-style:normal;fill:#64748b">agent-visible</text>
  <rect x="338" y="576" width="13" height="10" rx="2" fill="#fef2f2" stroke="#fecaca"/>
  <text x="354" y="585" class="elblr" style="font-style:normal">labelled only</text>

  <!-- ============================================================== -->
  <!-- PANEL 2 : THE TASK                                             -->
  <!-- ============================================================== -->
  <rect x="550" y="110" width="360" height="530" rx="18" fill="#f8fafc" stroke="#dbe3ec" filter="url(#soft)"/>
  <rect x="550" y="110" width="360" height="6" rx="3" fill="#7c3aed"/>
  <circle cx="584" cy="154" r="16" fill="#7c3aed"/>
  <text x="584" y="160" text-anchor="middle" class="stg" fill="#ffffff">2</text>
  <text x="610" y="160" class="stg" fill="#7c3aed">The task</text>

  <!-- agent -->
  <circle cx="730" cy="222" r="36" fill="#f5f3ff" stroke="#ddd6fe"/>
  <g class="ic" stroke="#7c3aed" transform="translate(707,199) scale(1.9167)"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g>
  <text x="730" y="284" text-anchor="middle" class="ttl">The agent investigates</text>
  <text x="730" y="306" text-anchor="middle" class="sub">explores the ledger with SQL + code,</text>
  <text x="730" y="324" text-anchor="middle" class="sub">follows the money, builds hypotheses</text>

  <g class="ic" stroke="#7c3aed" transform="translate(578,352) scale(1.1667)"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><circle cx="11.5" cy="14.5" r="2.5"/><path d="M13.3 16.3 15 18"/></g>
  <text x="614" y="372" class="ttl">&#8230; and flags 5 fraud schemes</text>

  <!-- scheme chips -->
  <rect x="578" y="390" width="304" height="32" rx="16" fill="#ffffff" stroke="#ddd6fe"/>
  <g class="ic" stroke="#7c3aed" transform="translate(588,397) scale(0.6667)"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="614" y="411" class="chip">Fake vendor payments</text>

  <rect x="578" y="428" width="304" height="32" rx="16" fill="#ffffff" stroke="#ddd6fe"/>
  <g class="ic" stroke="#7c3aed" transform="translate(588,435) scale(0.6667)"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="614" y="449" class="chip">Revenue manipulation</text>

  <rect x="578" y="466" width="304" height="32" rx="16" fill="#ffffff" stroke="#ddd6fe"/>
  <g class="ic" stroke="#7c3aed" transform="translate(588,473) scale(0.6667)"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="614" y="487" class="chip">Vendor kickbacks / collusion</text>

  <rect x="578" y="504" width="304" height="32" rx="16" fill="#ffffff" stroke="#ddd6fe"/>
  <g class="ic" stroke="#7c3aed" transform="translate(588,511) scale(0.6667)"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="614" y="525" class="chip">Ghost employees on payroll</text>

  <rect x="578" y="542" width="304" height="32" rx="16" fill="#ffffff" stroke="#ddd6fe"/>
  <g class="ic" stroke="#7c3aed" transform="translate(588,549) scale(0.6667)"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
  <text x="614" y="563" class="chip">Inventory theft / manipulation</text>

  <!-- ============================================================== -->
  <!-- PANEL 3 : THE SCORE                                            -->
  <!-- ============================================================== -->
  <rect x="980" y="110" width="360" height="530" rx="18" fill="#f8fafc" stroke="#dbe3ec" filter="url(#soft)"/>
  <rect x="980" y="110" width="360" height="6" rx="3" fill="#059669"/>
  <circle cx="1014" cy="154" r="16" fill="#059669"/>
  <text x="1014" y="160" text-anchor="middle" class="stg" fill="#ffffff">3</text>
  <text x="1040" y="160" class="stg" fill="#059669">The score</text>

  <!-- compare to key -->
  <circle cx="1160" cy="222" r="36" fill="#ecfdf5" stroke="#a7f3d0"/>
  <g class="ic" stroke="#059669" transform="translate(1137,199) scale(1.9167)"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></g>
  <text x="1160" y="284" text-anchor="middle" class="ttl">Compare to the answer key</text>
  <g class="ic" stroke="#10b981" transform="translate(1014,304) scale(0.8333)"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></g>
  <text x="1042" y="320" class="sub">the agent never sees the labels &#8212;</text>
  <text x="1042" y="338" class="sub">findings are matched to known fraud</text>

  <g class="ic" stroke="#059669" transform="translate(1008,358) scale(1.1667)"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></g>
  <text x="1044" y="378" class="ttl">How good was it?</text>

  <!-- metric chips -->
  <rect x="1008" y="396" width="304" height="32" rx="16" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1024" y="417" class="chip">Caught the fraud? <tspan fill="#059669">(Recall)</tspan></text>

  <rect x="1008" y="434" width="304" height="32" rx="16" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1024" y="455" class="chip">Flags were right? <tspan fill="#059669">(Precision &#183; F1)</tspan></text>

  <rect x="1008" y="472" width="304" height="32" rx="16" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1024" y="493" class="chip">Right kind of fraud? <tspan fill="#059669">(Type-F1)</tspan></text>

  <rect x="1008" y="510" width="304" height="32" rx="16" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1024" y="531" class="chip">Whole scheme caught? <tspan fill="#059669">(Coverage)</tspan></text>

  <rect x="1008" y="548" width="304" height="32" rx="16" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1024" y="569" class="chip">Stable across runs? <tspan fill="#059669">(Consistency)</tspan></text>

  <!-- ============================= FOOTER ============================= -->
  <text x="690" y="668" text-anchor="middle" class="foot">The harness repeats this across 12 open-weight LLMs &#215; 5 sectors to build the leaderboard.</text>
</svg>
