<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Inter, Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#004a8f"/></marker></defs>
<rect width="960" height="360" fill="#ffffff"/>
<text x="24" y="30" font-size="13" font-weight="700" fill="#004a8f" letter-spacing="2">BASE HARNESS: FOUR PHASES, ONE FIXED BUDGET</text>
<g stroke="#002c56" stroke-width="1.5">
<rect x="24" y="60" width="190" height="190" fill="#eaf1f9"/>
<rect x="256" y="60" width="190" height="190" fill="#eaf1f9"/>
<rect x="488" y="60" width="270" height="190" fill="#002c56"/>
<rect x="800" y="60" width="136" height="190" fill="#eaf1f9"/>
</g>
<g stroke="#004a8f" stroke-width="2" marker-end="url(#a)"><line x1="216" y1="155" x2="252" y2="155"/><line x1="448" y1="155" x2="484" y2="155"/><line x1="760" y1="155" x2="796" y2="155"/></g>
<g fill="#002c56" text-anchor="middle">
<text x="119" y="86" font-size="11" fill="#004a8f" font-weight="700">PHASE 1</text><text x="119" y="108" font-size="16" font-weight="700">Orient</text>
<text x="119" y="136" font-size="12">Profile the ledger</text><text x="119" y="154" font-size="12">with SQL: tables,</text><text x="119" y="172" font-size="12">accounts, calendars</text><text x="119" y="214" font-size="12" font-weight="700">~10% of budget</text>
<text x="351" y="86" font-size="11" fill="#004a8f" font-weight="700">PHASE 2</text><text x="351" y="108" font-size="16" font-weight="700">Plan, once</text>
<text x="351" y="136" font-size="12">Ranked, falsifiable</text><text x="351" y="154" font-size="12">hypotheses with exit</text><text x="351" y="172" font-size="12">criteria and a token</text><text x="351" y="190" font-size="12">budget each</text><text x="351" y="224" font-size="12" font-weight="700">no replanning</text>
<text x="868" y="108" font-size="16" font-weight="700">Report</text>
<text x="868" y="136" font-size="12">Flag entries with</text><text x="868" y="154" font-size="12">a scheme type via</text><text x="868" y="176" font-size="11" font-family="monospace" font-weight="700">report_suspicion</text></g>
<text x="868" y="86" font-size="11" fill="#004a8f" font-weight="700" text-anchor="middle">PHASE 4</text>
<g fill="#ffffff" text-anchor="middle">
<text x="623" y="86" font-size="11" fill="#9cc3e8" font-weight="700">PHASE 3</text><text x="623" y="108" font-size="16" font-weight="700">Investigate each hypothesis</text></g>
<g stroke="#9cc3e8" stroke-width="1.2" fill="#00396f">
<rect x="506" y="124" width="234" height="30"/><rect x="506" y="162" width="234" height="30"/><rect x="506" y="200" width="234" height="30"/></g>
<g fill="#ffffff" font-size="12">
<text x="518" y="144">Worker H1: reason, act, observe</text><text x="518" y="182">Worker H2: reason, act, observe</text><text x="518" y="220">Worker Hn: ... bounded loop, verdict</text></g>
<rect x="24" y="274" width="912" height="40" fill="#004a8f"/>
<text x="480" y="299" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Fixed 20M-token budget per run, same harness for every model, no reflection</text>
<text x="480" y="340" font-size="11" fill="#6e7884" text-anchor="middle">The leaderboard measures a model together with its scaffold.</text>
</svg>
